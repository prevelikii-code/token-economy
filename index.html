<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Трекер">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>Трекер задач и целей</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @font-face {
    font-family: 'Garet';
    src: url('./garet.ttf') format('truetype');
    font-weight: 400 700;
    font-display: swap;
  }

  :root {
    --bg: #000000;
    --surface: #121212;
    --card: #1c1c1e;
    --accent: #0095f6;
    --accent-soft: rgba(0, 149, 246, 0.12);
    --yellow: #f5c518;
    --yellow-soft: rgba(245, 197, 24, 0.12);
    --green: #4cd964;
    --green-soft: rgba(76, 217, 100, 0.12);
    --orange: #ff9500;
    --red: #ff3b30;
    --text: #ffffff;
    --text-secondary: #8e8e93;
    --separator: rgba(255, 255, 255, 0.08);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Garet', -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    padding: 0 16px 16px;
    padding-top: calc(8px + var(--safe-top));
    padding-bottom: calc(16px + var(--safe-bottom));
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    letter-spacing: -0.01em;
  }

  .container { max-width: 480px; margin: 0 auto; }

  /* HEADER */
  .header {
    padding: 20px 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--yellow);
    text-transform: uppercase;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--card);
    color: var(--text);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .icon-btn:active { opacity: 0.6; }

  /* STATS */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .stat {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 8px;
    text-align: center;
  }

  .stat-value {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
    font-weight: 500;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
  }

  .stat-value.blue { color: var(--accent); }
  .stat-value.green { color: var(--green); }
  .stat-value.orange { color: var(--orange); }

  /* PROGRESS */
  .progress-bar {
    margin-bottom: 16px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 500;
  }

  .progress-info span:last-child { color: var(--text-secondary); }

  .progress-track {
    height: 4px;
    background: var(--separator);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  /* TODAY */
  .section-title {
    font-size: 14px;
    font-weight: 400;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: var(--text-secondary);
  }

  .section-title .date {
    font-weight: 400;
    color: var(--text-secondary);
    font-size: 13px;
  }

  .today-list {
    margin-bottom: 20px;
  }

  .task-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    background: var(--card);
    margin-bottom: 2px;
    cursor: pointer;
    transition: opacity 0.1s;
    -webkit-user-select: none;
    user-select: none;
  }

  .task-row:first-child { border-radius: var(--radius) var(--radius) 0 0; }
  .task-row:last-child { border-radius: 0 0 var(--radius) var(--radius); margin-bottom: 0; }
  .task-row:only-child { border-radius: var(--radius); }

  .task-row:active { opacity: 0.7; }

  .checkbox {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--text-secondary);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .task-row.done .checkbox {
    border-color: var(--green);
    background: var(--green);
  }

  .task-row.done .checkbox::after {
    content: '\2713';
    color: #fff;
    font-weight: 700;
    font-size: 14px;
  }

  .task-row.done .task-name {
    color: var(--text-secondary);
    text-decoration: line-through;
  }

  .task-row.missed .checkbox {
    border-color: var(--red);
    background: rgba(255, 59, 48, 0.15);
  }

  .task-name {
    font-size: 15px;
    font-weight: 400;
    flex: 1;
    line-height: 1.3;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
  }

  /* WEEKS */
  .weeks-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 12px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .weeks-scroll::-webkit-scrollbar { display: none; }

  .week-pill {
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--card);
    color: var(--text-secondary);
    white-space: nowrap;
    flex-shrink: 0;
    transition: all 0.15s;
    border: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .week-pill:active { transform: scale(0.95); }
  .week-pill.active { background: var(--text); color: var(--bg); }
  .week-pill.completed { color: var(--green); }

  /* WEEK GRID */
  .week-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }

  .week-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .week-card-header h3 { font-size: 15px; font-weight: 600; font-family: 'Inter', -apple-system, system-ui, sans-serif; }
  .week-card-header span { font-size: 13px; color: var(--text-secondary); }

  .grid-7 {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .grid-day { text-align: center; }

  .grid-day-label {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .grid-day-num {
    font-size: 10px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .grid-tasks {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .grid-check {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 6px;
    border: none;
    background: var(--surface);
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    min-height: 26px;
  }

  .grid-check:active:not(.future) { transform: scale(0.85); }
  .grid-check.checked { background: var(--green); }
  .grid-check.checked::after { content: '\2713'; color: #fff; font-weight: 700; font-size: 12px; }
  .grid-check.missed { background: rgba(255, 59, 48, 0.25); }
  .grid-check.future { opacity: 0.2; cursor: default; }
  .grid-check.today { box-shadow: inset 0 0 0 2px var(--accent); }

  .task-legend-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--separator);
  }

  .legend-item {
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 3px;
    background: var(--surface);
  }

  /* REWARD */
  .reward {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .reward-icon { font-size: 28px; }
  .reward-info { flex: 1; }

  .reward-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .reward-desc {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .reward-badge {
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  .reward-badge.locked { background: var(--separator); color: var(--text-secondary); }
  .reward-badge.unlocked { background: var(--green-soft); color: var(--green); }

  /* GOALS */
  .goals-section { margin-bottom: 16px; }

  .goals-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    margin-bottom: 12px;
  }

  .goals-tabs::-webkit-scrollbar { display: none; }

  .goal-tab {
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    background: var(--card);
    color: var(--text-secondary);
    white-space: nowrap;
    flex-shrink: 0;
    border: none;
    font-family: inherit;
    -webkit-user-select: none;
    user-select: none;
    transition: all 0.15s;
  }

  .goal-tab:active { transform: scale(0.95); }
  .goal-tab.active { background: var(--yellow); color: var(--bg); }

  .goal-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--card);
    margin-bottom: 2px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  .goal-row:first-child { border-radius: var(--radius) var(--radius) 0 0; }
  .goal-row:last-child { border-radius: 0 0 var(--radius) var(--radius); margin-bottom: 0; }
  .goal-row:only-child { border-radius: var(--radius); }
  .goal-row:active { opacity: 0.7; }

  .goal-row .checkbox { border-radius: 50%; }
  .goal-row.done .checkbox { border-color: var(--green); background: var(--green); }
  .goal-row.done .checkbox::after { content: '\2713'; color: #fff; font-weight: 700; font-size: 14px; }
  .goal-row.done .task-name { color: var(--text-secondary); text-decoration: line-through; }

  .goal-add {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }

  .goal-add input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--separator);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
  }

  .goal-add input:focus { border-color: var(--yellow); }
  .goal-add input::placeholder { color: var(--text-secondary); opacity: 0.5; }

  .goal-add-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: var(--yellow);
    color: var(--bg);
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }

  .goal-add-btn:active { opacity: 0.8; }

  .goals-empty {
    text-align: center;
    padding: 24px;
    color: var(--text-secondary);
    font-size: 13px;
    background: var(--card);
    border-radius: var(--radius);
  }

  .goal-delete {
    border: none;
    background: none;
    color: var(--text-secondary);
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
    opacity: 0.5;
    flex-shrink: 0;
  }

  .goal-delete:active { opacity: 1; color: var(--red); }

  /* FOOTER ACTIONS */
  .footer-actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    padding-bottom: 16px;
  }

  .footer-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: var(--radius);
    background: var(--card);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .footer-btn:active { opacity: 0.6; }
  .footer-btn.danger { color: var(--red); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 100;
    justify-content: center;
    align-items: flex-end;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 20px;
    padding-bottom: calc(20px + var(--safe-bottom));
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    max-height: 90dvh;
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: var(--text-secondary);
    border-radius: 2px;
    margin: 0 auto 20px;
    opacity: 0.4;
  }

  .modal h3 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    letter-spacing: -0.02em;
  }

  .field { margin-bottom: 18px; }

  .field-label {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
    margin-bottom: 6px;
    display: block;
  }

  .field-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--separator);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.2s;
  }

  .field-input:focus { border-color: var(--accent); }
  .field-input::placeholder { color: var(--text-secondary); opacity: 0.5; }

  .task-add-row {
    display: flex;
    gap: 8px;
  }

  .task-add-row .field-input { flex: 1; }

  .btn-add {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-add:active { opacity: 0.8; }

  .setup-task {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: var(--card);
    border-radius: 10px;
    margin-bottom: 4px;
  }

  .setup-task span { font-size: 14px; font-weight: 500; }

  .btn-remove {
    border: none;
    background: none;
    color: var(--red);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }

  .btn-remove:active { opacity: 0.5; }

  .modal-footer {
    display: flex;
    gap: 10px;
    margin-top: 24px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn:active { opacity: 0.8; }
  .btn-cancel { background: var(--card); color: var(--text); }
  .btn-save { background: var(--accent); color: #fff; }

  /* CELEBRATION */
  .cele-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 199;
    display: none;
  }

  .cele-overlay.show { display: block; }

  .cele {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--surface);
    border-radius: 24px;
    padding: 40px 28px 28px;
    text-align: center;
    z-index: 200;
    display: none;
    animation: popIn 0.35s ease;
    width: 85%;
    max-width: 320px;
  }

  .cele.show { display: block; }

  @keyframes popIn {
    0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }

  .cele-emoji { font-size: 48px; margin-bottom: 12px; }
  .cele h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .cele p { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
  .cele .btn-save { width: 100%; }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 60px 20px;
  }

  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .empty p { color: var(--text-secondary); font-size: 14px; line-height: 1.5; max-width: 280px; margin: 0 auto 24px; font-family: 'Inter', -apple-system, system-ui, sans-serif; font-weight: 300; }

  .btn-start {
    padding: 14px 32px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-start:active { opacity: 0.8; }

  .hidden { display: none !important; }

  @media (min-width: 481px) {
    .modal { border-radius: 20px; max-width: 440px; margin: auto; }
    .modal-overlay { align-items: center; padding: 20px; }
  }

  @media (max-width: 380px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid-check { min-height: 22px; }
    .stat-value { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Трекер задач и целей</h1>
    <div class="header-actions">
      <button class="icon-btn" onclick="openSettings()" aria-label="Настройки">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats hidden" id="statsBar">
    <div class="stat">
      <div class="stat-value blue" id="statDay">0</div>
      <div class="stat-label">День</div>
    </div>
    <div class="stat">
      <div class="stat-value green" id="statDone">0%</div>
      <div class="stat-label">Прогресс</div>
    </div>
    <div class="stat">
      <div class="stat-value orange" id="statStreak">0</div>
      <div class="stat-label">Серия</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statRewards">0</div>
      <div class="stat-label">Награды</div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-bar hidden" id="progressSection">
    <div class="progress-info">
      <span>Спринт</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
  </div>

  <!-- TODAY -->
  <div class="today-list hidden" id="todayPanel">
    <div class="section-title">
      <span>&#x1F3AF; Сегодня</span>
      <span class="date" id="todayDate"></span>
    </div>
    <div id="todayTasks"></div>
  </div>

  <!-- WEEKS -->
  <div class="hidden" id="weeksSection">
    <div class="section-title" style="margin-top:4px">&#x1F4C5; Недели</div>
    <div class="weeks-scroll" id="weekTabs"></div>
  </div>

  <!-- WEEK VIEW -->
  <div class="week-card hidden" id="weekView">
    <div class="week-card-header">
      <h3 id="weekTitle">Неделя 1</h3>
      <span id="weekProgressMini"></span>
    </div>
    <div class="grid-7" id="daysGrid"></div>
    <div class="task-legend-row" id="taskLegend"></div>
  </div>

  <!-- REWARD -->
  <div class="reward hidden" id="rewardCard">
    <div class="reward-icon" id="rewardEmoji"></div>
    <div class="reward-info">
      <div class="reward-title" id="rewardTitle"></div>
      <div class="reward-desc" id="rewardText"></div>
    </div>
    <div class="reward-badge" id="rewardStatus"></div>
  </div>

  <!-- GOALS -->
  <div class="goals-section" id="goalsSection">
    <div class="section-title" style="margin-top:4px">
      <span>&#x1F3C6; Цели</span>
    </div>
    <div class="goals-tabs" id="goalsTabs"></div>
    <div id="goalsList"></div>
    <div class="goal-add">
      <input type="text" id="goalInput" placeholder="Новая цель" onkeydown="if(event.key==='Enter'){event.preventDefault();addGoal()}" />
      <button class="goal-add-btn" onclick="addGoal()">+</button>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="footer-actions hidden" id="footerActions">
    <button class="footer-btn" onclick="exportData()">Экспорт</button>
    <button class="footer-btn" onclick="importDataDialog()">Импорт</button>
    <button class="footer-btn danger" onclick="resetConfirm()">Сбросить</button>
  </div>

  <!-- EMPTY -->
  <div class="empty" id="emptyState">
    <div class="empty-icon"></div>
    <h3>Начни свой спринт</h3>
    <p>Добавь задачи на каждый день, назначь награду за неделю и отслеживай прогресс</p>
    <button class="btn-start" onclick="openSettings()">Настроить</button>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Настройка</h3>

    <div class="field">
      <label class="field-label">Дата начала</label>
      <input type="date" id="startDateInput" class="field-input" />
    </div>

    <div class="field">
      <label class="field-label">Ежедневные задачи</label>
      <div id="taskListSetup"></div>
      <div class="task-add-row">
        <input type="text" id="newTaskInput" class="field-input" placeholder="Новая задача" onkeydown="if(event.key==='Enter'){event.preventDefault();addTask()}" />
        <button class="btn-add" onclick="addTask()">+</button>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Награда за неделю</label>
      <input type="text" id="rewardInput" class="field-input" placeholder="Например: сходить в кино" />
    </div>

    <div class="field">
      <label class="field-label">Минимум галочек для награды</label>
      <div style="display:flex;align-items:center;gap:10px">
        <input type="number" id="minCheckmarks" min="1" max="100" value="7" class="field-input" style="width:80px" />
        <span style="font-size:13px;color:var(--text-secondary)">из <span id="totalPossible">0</span></span>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeSettings()">Отмена</button>
      <button class="btn btn-save" onclick="saveSettings()">Сохранить</button>
    </div>
  </div>
</div>

<!-- CELEBRATION -->
<div class="cele-overlay" id="celebrationOverlay" onclick="closeCelebration()"></div>
<div class="cele" id="celebration">
  <div class="cele-emoji"></div>
  <h2>Цель достигнута!</h2>
  <p id="celebrationText"></p>
  <button class="btn btn-save" onclick="closeCelebration()">Отлично</button>
</div>

<!-- IMPORT MODAL -->
<div class="modal-overlay" id="importModal" onclick="if(event.target===this)closeImport()">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Импорт</h3>
    <div class="field">
      <label class="field-label">Вставь данные (JSON)</label>
      <textarea id="importTextarea" class="field-input" rows="5" placeholder='{"tasks":...}' style="resize:vertical;min-height:80px"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeImport()">Отмена</button>
      <button class="btn btn-save" onclick="importData()">Импорт</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'token_economy_v1';
const DAY_NAMES = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTH_NAMES = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

let state = loadState();
let activeWeek = null;
let tempTasks = [];

function defaultState() {
  return { startDate: null, tasks: [], reward: '', minCheckmarks: 7, checks: {}, celebratedWeeks: {}, goals: { week: [], month: [], quarter: [], half: [], year: [] } };
}

function loadState() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch(e) {}
  return defaultState();
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function formatDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a, b) { return Math.floor((b-a)/864e5); }
function getToday() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

function getSprintDay() {
  if (!state.startDate) return 0;
  return Math.max(0, daysBetween(parseDate(state.startDate), getToday()) + 1);
}

function getCurrentWeek() {
  const d = getSprintDay();
  return d <= 0 ? 0 : Math.min(Math.ceil(d / 7), 13);
}

function getWeekDates(w) {
  if (!state.startDate) return [];
  const s = addDays(parseDate(state.startDate), (w-1)*7);
  return Array.from({length:7}, (_,i) => addDays(s, i));
}

function checkKey(d, t) { return `${formatDate(d)}_${t}`; }
function isChecked(d, t) { return !!state.checks[checkKey(d, t)]; }

function toggleCheck(d, t) {
  const k = checkKey(d, t);
  state.checks[k] ? delete state.checks[k] : state.checks[k] = true;
  saveState();
  render();
}

function getWeekChecks(w) {
  const dates = getWeekDates(w);
  let done = 0, total = 0;
  const today = getToday();
  for (const d of dates) {
    if (d > today) continue;
    for (let t = 0; t < state.tasks.length; t++) { total++; if (isChecked(d, t)) done++; }
  }
  return { done, total };
}

function getStreak() {
  if (!state.startDate || !state.tasks.length) return 0;
  const today = getToday();
  let streak = 0;
  let cd = new Date(today);
  let todayOk = state.tasks.every((_, t) => isChecked(today, t));
  if (!todayOk) cd = addDays(today, -1);
  const start = parseDate(state.startDate);
  while (cd >= start) {
    if (!state.tasks.every((_, t) => isChecked(cd, t))) break;
    streak++;
    cd = addDays(cd, -1);
  }
  return streak;
}

function getTotalProgress() {
  if (!state.startDate || !state.tasks.length) return 0;
  const start = parseDate(state.startDate);
  const today = getToday();
  const lastDay = today < addDays(start, 89) ? today : addDays(start, 89);
  const totalDays = daysBetween(start, lastDay) + 1;
  if (totalDays <= 0) return 0;
  let done = 0, total = 0;
  for (let i = 0; i < totalDays; i++) {
    const d = addDays(start, i);
    for (let t = 0; t < state.tasks.length; t++) { total++; if (isChecked(d, t)) done++; }
  }
  return total > 0 ? Math.round((done/total)*100) : 0;
}

function getEarnedRewards() {
  let c = 0;
  for (let w = 1; w <= 13; w++) if (getWeekChecks(w).done >= state.minCheckmarks) c++;
  return c;
}

function isWeekCompleted(w) { return getWeekChecks(w).done >= state.minCheckmarks; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function render() {
  const ok = state.startDate && state.tasks.length > 0;
  ['statsBar','progressSection','todayPanel','weeksSection','weekView','rewardCard','goalsSection','footerActions'].forEach(id =>
    document.getElementById(id).classList.toggle('hidden', !ok)
  );
  document.getElementById('emptyState').classList.toggle('hidden', ok);
  if (!ok) return;

  const sd = getSprintDay();
  const progress = getTotalProgress();

  document.getElementById('statDay').textContent = Math.min(sd, 90);
  document.getElementById('statDone').textContent = progress + '%';
  document.getElementById('statStreak').textContent = getStreak();
  document.getElementById('statRewards').textContent = getEarnedRewards();
  document.getElementById('progressPercent').textContent = progress + '%';
  document.getElementById('progressFill').style.width = progress + '%';

  renderToday();
  const cur = getCurrentWeek();
  if (activeWeek === null) activeWeek = cur || 1;
  renderWeekTabs(cur);
  renderWeekView(activeWeek);
  renderReward(activeWeek);
  checkCelebration();
}

function renderToday() {
  const today = getToday();
  const sd = getSprintDay();
  document.getElementById('todayDate').textContent = `${today.getDate()} ${MONTH_NAMES[today.getMonth()]}, день ${Math.min(sd, 90)}`;
  const c = document.getElementById('todayTasks');
  c.innerHTML = '';
  if (sd <= 0 || sd > 90) {
    c.innerHTML = '<div style="color:var(--text-secondary);font-size:14px;padding:16px">Спринт не начался или завершен</div>';
    return;
  }
  state.tasks.forEach((task, idx) => {
    const checked = isChecked(today, idx);
    const div = document.createElement('div');
    div.className = 'task-row' + (checked ? ' done' : '');
    div.innerHTML = `<div class="checkbox"></div><div class="task-name">${esc(task)}</div>`;
    div.onclick = () => toggleCheck(today, idx);
    c.appendChild(div);
  });
}

function renderWeekTabs(cur) {
  const c = document.getElementById('weekTabs');
  c.innerHTML = '';
  for (let w = 1; w <= 13; w++) {
    const t = document.createElement('div');
    t.className = 'week-pill';
    if (w === activeWeek) t.classList.add('active');
    if (isWeekCompleted(w)) t.classList.add('completed');
    t.textContent = w;
    t.onclick = () => { activeWeek = w; render(); };
    c.appendChild(t);
  }
  requestAnimationFrame(() => {
    const active = c.querySelector('.active');
    if (active) active.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  });
}

function renderWeekView(wn) {
  document.getElementById('weekTitle').textContent = `Неделя ${wn}`;
  const { done } = getWeekChecks(wn);
  document.getElementById('weekProgressMini').textContent = `${done} / ${state.tasks.length * 7}`;

  const dates = getWeekDates(wn);
  const today = getToday();
  const grid = document.getElementById('daysGrid');
  grid.innerHTML = '';

  dates.forEach(date => {
    const col = document.createElement('div');
    col.className = 'grid-day';
    const jsDay = date.getDay();
    const ruIdx = jsDay === 0 ? 6 : jsDay - 1;
    col.innerHTML = `<div class="grid-day-label">${DAY_NAMES[ruIdx]}</div><div class="grid-day-num">${date.getDate()}</div><div class="grid-tasks"></div>`;
    grid.appendChild(col);
    const tc = col.querySelector('.grid-tasks');
    state.tasks.forEach((_, ti) => {
      const cb = document.createElement('div');
      cb.className = 'grid-check';
      const isFuture = date > today;
      const isToday = formatDate(date) === formatDate(today);
      const checked = isChecked(date, ti);
      if (checked) cb.classList.add('checked');
      else if (!isFuture && !isToday) cb.classList.add('missed');
      if (isFuture) cb.classList.add('future');
      if (isToday) cb.classList.add('today');
      if (!isFuture) cb.onclick = () => toggleCheck(date, ti);
      tc.appendChild(cb);
    });
  });

  const legend = document.getElementById('taskLegend');
  legend.innerHTML = '';
  state.tasks.forEach((task, i) => {
    const it = document.createElement('div');
    it.className = 'legend-item';
    it.innerHTML = `<div class="legend-dot"></div>${i+1}. ${esc(task)}`;
    legend.appendChild(it);
  });
}

function renderReward(wn) {
  const comp = isWeekCompleted(wn);
  const { done } = getWeekChecks(wn);
  document.getElementById('rewardEmoji').textContent = comp ? '✅' : '🎯';
  document.getElementById('rewardTitle').textContent = state.reward || 'Награда не задана';
  const left = Math.max(0, state.minCheckmarks - done);
  document.getElementById('rewardText').textContent = comp ? 'Заслужено!' : `Осталось ${left} галочек`;
  const badge = document.getElementById('rewardStatus');
  badge.className = 'reward-badge ' + (comp ? 'unlocked' : 'locked');
  badge.textContent = comp ? 'Получено' : `${done}/${state.minCheckmarks}`;
}

function checkCelebration() {
  const cw = getCurrentWeek();
  if (cw > 0 && isWeekCompleted(cw) && !state.celebratedWeeks[cw]) {
    state.celebratedWeeks[cw] = true;
    saveState();
    showCelebration();
  }
}

function showCelebration() {
  document.getElementById('celebrationText').textContent = `Неделя завершена! Награда: ${state.reward || 'заслужена'}`;
  document.getElementById('celebrationOverlay').classList.add('show');
  document.getElementById('celebration').classList.add('show');
}

function closeCelebration() {
  document.getElementById('celebrationOverlay').classList.remove('show');
  document.getElementById('celebration').classList.remove('show');
}

function openSettings() {
  tempTasks = [...state.tasks];
  document.getElementById('startDateInput').value = state.startDate || formatDate(getToday());
  document.getElementById('rewardInput').value = state.reward || '';
  document.getElementById('minCheckmarks').value = state.minCheckmarks || 7;
  renderTempTasks();
  document.getElementById('settingsModal').classList.add('show');
}

function closeSettings() { document.getElementById('settingsModal').classList.remove('show'); }

function renderTempTasks() {
  const c = document.getElementById('taskListSetup');
  c.innerHTML = '';
  document.getElementById('totalPossible').textContent = tempTasks.length * 7;
  tempTasks.forEach((task, i) => {
    const d = document.createElement('div');
    d.className = 'setup-task';
    d.innerHTML = `<span>${esc(task)}</span><button class="btn-remove" onclick="removeTask(${i})">&#10005;</button>`;
    c.appendChild(d);
  });
}

function addTask() {
  const inp = document.getElementById('newTaskInput');
  const v = inp.value.trim();
  if (!v) return;
  tempTasks.push(v);
  inp.value = '';
  renderTempTasks();
  inp.focus();
}

function removeTask(i) { tempTasks.splice(i, 1); renderTempTasks(); }

function saveSettings() {
  state.startDate = document.getElementById('startDateInput').value;
  state.tasks = [...tempTasks];
  state.reward = document.getElementById('rewardInput').value.trim();
  state.minCheckmarks = parseInt(document.getElementById('minCheckmarks').value) || 7;
  saveState();
  closeSettings();
  render();
}

function exportData() {
  const json = JSON.stringify(state, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tracker_${formatDate(getToday())}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importDataDialog() {
  document.getElementById('importTextarea').value = '';
  document.getElementById('importModal').classList.add('show');
}

function closeImport() { document.getElementById('importModal').classList.remove('show'); }

function importData() {
  try {
    const d = JSON.parse(document.getElementById('importTextarea').value);
    if (d.tasks && d.startDate) {
      state = { ...defaultState(), ...d };
      saveState();
      closeImport();
      render();
    } else { alert('Неверный формат'); }
  } catch(e) { alert('Ошибка JSON'); }
}

function resetConfirm() {
  if (confirm('Сбросить все данные?')) {
    if (confirm('Точно? Задачи, галочки, награды — всё удалится')) {
      state = defaultState();
      saveState();
      activeWeek = null;
      render();
    }
  }
}

// ============ GOALS ============
const GOAL_PERIODS = [
  { key: 'week', label: 'Неделя' },
  { key: 'month', label: 'Месяц' },
  { key: 'quarter', label: '3 мес' },
  { key: 'half', label: '6 мес' },
  { key: 'year', label: 'Год' }
];

let activeGoalPeriod = 'week';

function ensureGoals() {
  if (!state.goals) state.goals = {};
  GOAL_PERIODS.forEach(p => { if (!state.goals[p.key]) state.goals[p.key] = []; });
}

function renderGoals() {
  ensureGoals();
  const tabs = document.getElementById('goalsTabs');
  tabs.innerHTML = '';
  GOAL_PERIODS.forEach(p => {
    const t = document.createElement('div');
    t.className = 'goal-tab' + (p.key === activeGoalPeriod ? ' active' : '');
    const count = state.goals[p.key].filter(g => g.done).length;
    const total = state.goals[p.key].length;
    t.textContent = p.label + (total > 0 ? ` ${count}/${total}` : '');
    t.onclick = () => { activeGoalPeriod = p.key; renderGoals(); };
    tabs.appendChild(t);
  });

  const list = document.getElementById('goalsList');
  list.innerHTML = '';
  const goals = state.goals[activeGoalPeriod];

  if (goals.length === 0) {
    list.innerHTML = '<div class="goals-empty">Пока нет целей</div>';
    return;
  }

  const sorted = goals.map((g, i) => ({ ...g, idx: i }));
  sorted.sort((a, b) => (b.done ? 1 : 0) - (a.done ? 1 : 0));

  sorted.forEach(goal => {
    const row = document.createElement('div');
    row.className = 'goal-row' + (goal.done ? ' done' : '');
    row.innerHTML = `<div class="checkbox"></div><div class="task-name">${esc(goal.text)}</div><button class="goal-delete" onclick="event.stopPropagation();deleteGoal(${goal.idx})">&#10005;</button>`;
    row.onclick = () => toggleGoal(goal.idx);
    list.appendChild(row);
  });
}

function toggleGoal(i) {
  ensureGoals();
  state.goals[activeGoalPeriod][i].done = !state.goals[activeGoalPeriod][i].done;
  saveState();
  renderGoals();
}

function addGoal() {
  ensureGoals();
  const inp = document.getElementById('goalInput');
  const v = inp.value.trim();
  if (!v) return;
  state.goals[activeGoalPeriod].push({ text: v, done: false });
  inp.value = '';
  saveState();
  renderGoals();
  inp.focus();
}

function deleteGoal(i) {
  ensureGoals();
  state.goals[activeGoalPeriod].splice(i, 1);
  saveState();
  renderGoals();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// Telegram WebApp integration
try {
  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
} catch(e) {}

render();
renderGoals();
</script>
</body>
</html>
